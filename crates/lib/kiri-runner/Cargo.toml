[package]
name = "kiri-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
kiri-common = { path = "../kiri-common" }
kiri-backend = { path = "../kiri-backend" }
kiri = { path = "../kiri" }
kiri-assets = { path = "../kiri-assets" }
kiri-gfx = { path = "../kiri-gfx" }
kiri-resources = { path = "../kiri-resources" }
kiri-render = { path = "../kiri-render" }
kiri-math = { path = "../kiri-math" }
thiserror = "1.0.61"
directories = "5.0.1"
raw-window-handle = "0.6.2"
log = "0.4.22"
bevy_tasks = { version = "0.14.0", features = ["multi_threaded"] }
puffin = "0.19.0"
sdl2 = { version = "0.37.0", default-features = false, features = [
    "raw-window-handle",
] }

[dev-dependencies]
simple_logger = "5.0.0"
puffin_http = "0.16.1"

[[example]]
name = "loop"

[features]
devel = ["kiri-assets/devel", "kiri-resources/devel", "kiri-render/devel"]
