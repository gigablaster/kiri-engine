[package]
name = "kiri-assets"
version = "0.1.0"
edition = "2021"

[dependencies]
kiri-common = { path = "../kiri-common" }
kiri-backend = { path = "../kiri-backend" }
kiri-vfs = { path = "../kiri-vfs" }
speedy = { version = "0.8.7", features = ["speedy-derive"] }
bytes = "1.7.1"
image = { version = "0.25.2", default-features = false, features = [
    "jpeg",
    "png",
    "pnm",
    "tga",
    "tiff",
    "webp",
    "bmp",
    "hdr",
], optional = true }

intel_tex_2 = { version = "0.3.0", optional = true }
normalize-path = "0.2.1"
numquant = "0.2.0"
mikktspace = { git = "https://github.com/gigablaster/mikktspace.git", features = [
    "glam",
], default-features = false, optional = true }
glam = "0.29.0"
meshopt = { version = "0.3.0", optional = true }
gltf = { version = "1.4.1", features = ["KHR_materials_emissive_strength"], optional = true }
thiserror = "1.0.61"
shader-prepper = { version = "0.3.0-pre.3", optional = true }
ash = "0.38.0"
uuid = { version = "1.10.0", features = ["v4"] }
log = "0.4.20"

[features]
devel = ["dep:image", "dep:intel_tex_2", "dep:mikktspace", "dep:meshopt", "dep:gltf", "dep:shader-prepper"]